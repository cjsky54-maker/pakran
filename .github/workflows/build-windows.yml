name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write   # required to publish GitHub Releases on tag builds

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build standalone EXE
        run: python -m PyInstaller DriverThermalQC.spec --noconfirm

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriverThermalQC-windows-exe
          path: dist/DriverThermalQC.exe

      # Tag builds publish a real GitHub Release with the EXE attached, so
      # the Releases page is the one place users download from. Regular
      # pushes to main only upload the Actions artifact above.
      - name: Publish GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not (gh release view $tag)) {
            gh release create $tag dist/DriverThermalQC.exe `
              --title "DriverThermalQC $tag" --generate-notes
          } else {
            gh release upload $tag dist/DriverThermalQC.exe --clobber
          }
